openapi: 3.1.0
info:
  title: ShopCloud - API Gateway
  version: 1.0.0
  description: Documento consolidado del API Gateway de ShopCloud, agrupando los contratos de MS1, MS2, MS3, MS4 y MS5.
servers:
  - url: /
tags:
  - name: MS1 Productos
    description: Catálogo de productos e inventario
  - name: MS2 Pedidos
    description: Gestión de pedidos
  - name: MS3 Usuarios
    description: Registro, inicio de sesión y gestión de usuarios
  - name: MS4 Historial
    description: Consolidación de historial de usuario, pedidos y productos
  - name: MS5 Analytics
    description: Analítica con Athena
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MS1CategoriaCreate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          example: Perifericos
      required:
        - nombre
    MS1CategoriaUpdate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          example: Accesorios de PC
      required:
        - nombre
    MS1CategoriaResponse:
      allOf:
        - $ref: '#/components/schemas/MS1CategoriaCreate'
        - type: object
          properties:
            id:
              type: integer
              example: 1
          required:
            - id
    MS1ProductoCreate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 150
          example: Teclado mecanico
        precio:
          type: number
          format: float
          exclusiveMinimum: 0
          example: 129.99
        stock:
          type: integer
          minimum: 0
          example: 15
        categoria_id:
          type: integer
          example: 1
      required:
        - nombre
        - precio
        - categoria_id
    MS1ProductoUpdate:
      type: object
      properties:
        stock:
          type: integer
          minimum: 0
          example: 42
      required:
        - stock
    MS1ProductoResponse:
      allOf:
        - $ref: '#/components/schemas/MS1ProductoCreate'
        - type: object
          properties:
            id:
              type: integer
              example: 123
            creado_en:
              type: string
              format: date-time
              example: '2026-04-24T12:34:56.789000'
          required:
            - id
            - creado_en
    MS2DetalleResponseDTO:
      type: object
      properties:
        cantidad:
          type: integer
          format: int32
        precioUnitario:
          type: number
        productoId:
          type: integer
          format: int64
        subtotal:
          type: number
    MS2ItemDTO:
      type: object
      properties:
        cantidad:
          type: integer
          format: int32
        productoId:
          type: integer
          format: int64
      required:
        - cantidad
        - productoId
    MS2PedidoRequestDTO:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MS2ItemDTO'
        usuarioId:
          type: string
          minLength: 1
    MS2PedidoResponseDTO:
      type: object
      properties:
        creadoEn:
          type: string
          format: date-time
        detalle:
          type: array
          items:
            $ref: '#/components/schemas/MS2DetalleResponseDTO'
        estado:
          type: string
          enum:
            - PENDIENTE
            - ENVIADO
            - ENTREGADO
        id:
          type: integer
          format: int64
        total:
          type: number
        usuarioId:
          type: string
    MS4ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: Usuario no encontrado
      required:
        - detail
    MS4UsuarioResponse:
      type: object
      properties:
        id:
          type: string
          nullable: true
          example: 661bfe2f8f5b6d8f888a1234
        nombre:
          type: string
          example: Carlos
        apellido:
          type: string
          example: Garcia
        pais:
          type: string
          nullable: true
          example: Perú
      required:
        - nombre
        - apellido
    MS4CategoriaResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          example: Perifericos
      required:
        - id
        - nombre
    MS4ProductoResponse:
      type: object
      properties:
        id:
          type: integer
          example: 123
        nombre:
          type: string
          minLength: 2
          maxLength: 150
          example: Teclado mecanico
        precio:
          type: number
          format: float
          exclusiveMinimum: 0
          example: 129.99
        stock:
          type: integer
          minimum: 0
          example: 15
        categoria_id:
          type: integer
          example: 1
        creado_en:
          type: string
          format: date-time
          example: '2026-04-24T12:34:56.789000'
      required:
        - id
        - nombre
        - precio
        - stock
        - categoria_id
        - creado_en
    MS4DetallePedidoResponse:
      type: object
      properties:
        producto_id:
          type: integer
          example: 123
        cantidad:
          type: integer
          minimum: 1
          example: 2
        precio_unitario:
          type: number
          format: float
          minimum: 0
          example: 129.99
        producto:
          allOf:
            - $ref: '#/components/schemas/MS4ProductoResponse'
          nullable: true
      required:
        - producto_id
        - cantidad
        - precio_unitario
    MS4PedidoResponse:
      type: object
      properties:
        id:
          type: integer
          example: 501
        usuario_id:
          oneOf:
            - type: integer
            - type: string
          example: 42
        total:
          type: number
          format: float
          minimum: 0
          example: 259.98
        estado:
          type: string
          nullable: true
          example: enviado
        creado_en:
          type: string
          format: date-time
          nullable: true
          example: '2026-04-25T10:30:00.000000'
        detalle:
          type: array
          items:
            $ref: '#/components/schemas/MS4DetallePedidoResponse'
      required:
        - id
        - usuario_id
        - total
        - detalle
    MS4HistorialResponse:
      type: object
      properties:
        usuario:
          $ref: '#/components/schemas/MS4UsuarioResponse'
        pedidos:
          type: array
          items:
            $ref: '#/components/schemas/MS4PedidoResponse'
      required:
        - usuario
        - pedidos
    MS4ResumenHistorialResponse:
      type: object
      properties:
        usuario_id:
          type: string
          example: 42
        nro_pedidos:
          type: integer
          minimum: 0
          example: 3
        total_gastado:
          type: number
          format: float
          minimum: 0
          example: 589.47
      required:
        - usuario_id
        - nro_pedidos
        - total_gastado
    MS5QueryResult:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - success
            - error
            - timeout
        query_id:
          type: string
        data:
          type: array
          description: Array de filas, donde cada fila es un arreglo de valores string
          items:
            type: array
            items:
              type: string
        state:
          type: string
        message:
          type: string
    MS3SignupRequest:
      type: object
      required:
        - nombre
        - apellido
        - email
        - password
      properties:
        nombre:
          type: string
          example: Carlos
        apellido:
          type: string
          example: García
        email:
          type: string
          example: carlos@email.com
        password:
          type: string
          example: mi_password_123
        telefono:
          type: string
          example: '999888777'
    MS3LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    MS3UpdateDireccionRequest:
      type: object
      properties:
        direccion:
          type: object
          properties:
            calle:
              type: string
            ciudad:
              type: string
            pais:
              type: string
    MS3AsignarRolRequest:
      type: object
      required:
        - rol
      properties:
        rol:
          type: string
          enum:
            - user
            - admin
paths:
  /categorias/:
    get:
      summary: Listar categorías
      operationId: ms1ListarCategorias
      tags:
        - MS1 Productos
      parameters:
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        '200':
          description: Lista paginada de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MS1CategoriaResponse'
    post:
      summary: Crear categoría
      operationId: ms1CrearCategoria
      tags:
        - MS1 Productos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MS1CategoriaCreate'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS1CategoriaResponse'
  /categorias/{categoria_id}:
    get:
      summary: Obtener categoría
      operationId: ms1ObtenerCategoria
      tags:
        - MS1 Productos
      parameters:
        - name: categoria_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS1CategoriaResponse'
        '404':
          description: Categoría no encontrada
    patch:
      summary: Actualizar parcialmente categoría
      operationId: ms1ActualizarCategoria
      tags:
        - MS1 Productos
      parameters:
        - name: categoria_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MS1CategoriaUpdate'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS1CategoriaResponse'
        '404':
          description: Categoría no encontrada
  /productos/:
    get:
      summary: Listar productos
      operationId: ms1ListarProductos
      tags:
        - MS1 Productos
      parameters:
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        '200':
          description: Lista paginada de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MS1ProductoResponse'
    post:
      summary: Crear producto
      operationId: ms1CrearProducto
      tags:
        - MS1 Productos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MS1ProductoCreate'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS1ProductoResponse'
  /productos/{producto_id}:
    get:
      summary: Obtener producto
      operationId: ms1DetalleProducto
      tags:
        - MS1 Productos
      parameters:
        - name: producto_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS1ProductoResponse'
        '404':
          description: Producto no encontrado
    patch:
      summary: Actualizar stock de producto
      operationId: ms1ActualizarProducto
      tags:
        - MS1 Productos
      parameters:
        - name: producto_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MS1ProductoUpdate'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS1ProductoResponse'
        '404':
          description: Producto no encontrado
  /pedidos:
    get:
      summary: Listar todos los pedidos (paginado)
      operationId: ms2ListarTodos
      tags:
        - MS2 Pedidos
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
    post:
      summary: Crear nuevo pedido (valida productos en MS1)
      operationId: ms2Crear
      tags:
        - MS2 Pedidos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MS2PedidoRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS2PedidoResponseDTO'
  /pedidos/mis-pedidos:
    get:
      summary: Listar mis propios pedidos (usa el token)
      operationId: ms2MisPedidos
      tags:
        - MS2 Pedidos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MS2PedidoResponseDTO'
  /pedidos/usuario/{usuarioId}:
    get:
      summary: Listar pedidos de un usuario
      operationId: ms2ListarPorUsuario
      tags:
        - MS2 Pedidos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: usuarioId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MS2PedidoResponseDTO'
  /pedidos/{id}:
    delete:
      summary: Eliminar pedido
      operationId: ms2Eliminar
      tags:
        - MS2 Pedidos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
    get:
      summary: Obtener pedido por ID
      operationId: ms2Obtener
      tags:
        - MS2 Pedidos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS2PedidoResponseDTO'
  /pedidos/{id}/estado:
    put:
      summary: Actualizar estado del pedido
      operationId: ms2ActualizarEstado
      tags:
        - MS2 Pedidos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS2PedidoResponseDTO'
  /usuarios/signup:
    post:
      summary: Crear una nueva cuenta (Registro)
      operationId: ms3Signup
      tags:
        - MS3 Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MS3SignupRequest'
      responses:
        '201':
          description: Usuario creado exitosamente con su token
        '400':
          description: Email ya en uso o datos inválidos
  /usuarios/login:
    post:
      summary: Iniciar sesión
      operationId: ms3Login
      tags:
        - MS3 Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MS3LoginRequest'
      responses:
        '200':
          description: Login exitoso, devuelve el token JWT
        '401':
          description: Credenciales incorrectas
  /usuarios:
    get:
      summary: Lista usuarios con paginación
      operationId: ms3ListarUsuarios
      tags:
        - MS3 Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de usuarios
        '401':
          description: No autorizado
  /usuarios/{id}:
    get:
      summary: Obtener perfil de un usuario
      operationId: ms3ObtenerUsuario
      tags:
        - MS3 Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
        '401':
          description: No autorizado
        '404':
          description: Usuario no encontrado
    delete:
      summary: Eliminar cuenta de usuario (solo admin)
      operationId: ms3EliminarUsuario
      tags:
        - MS3 Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Usuario eliminado
        '403':
          description: No autorizado (no eres admin)
        '404':
          description: Usuario no encontrado
  /usuarios/{id}/direccion:
    put:
      summary: Actualizar dirección del usuario
      operationId: ms3ActualizarDireccion
      tags:
        - MS3 Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MS3UpdateDireccionRequest'
      responses:
        '200':
          description: Dirección actualizada
        '401':
          description: No autorizado
        '404':
          description: Usuario no encontrado
  /usuarios/{id}/rol:
    patch:
      summary: Asignar rol a un usuario (solo admin)
      operationId: ms3AsignarRol
      tags:
        - MS3 Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MS3AsignarRolRequest'
      responses:
        '200':
          description: Rol actualizado
        '403':
          description: No autorizado (no eres admin)
        '404':
          description: Usuario no encontrado
  /historial/{usuario_id}:
    get:
      summary: Obtener historial consolidado de usuario
      operationId: ms4ObtenerHistorial
      security:
        - bearerAuth: []
      tags:
        - MS4 Historial
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Historial consolidado obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS4HistorialResponse'
        '401':
          description: Falta el token de autorización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS4ErrorResponse'
        '502':
          description: Error de integración con servicios upstream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS4ErrorResponse'
  /historial/resumen/{usuario_id}:
    get:
      summary: Obtener resumen de compras de usuario
      operationId: ms4ObtenerResumenHistorial
      security:
        - bearerAuth: []
      tags:
        - MS4 Historial
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resumen de historial obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS4ResumenHistorialResponse'
        '401':
          description: Falta el token de autorización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS4ErrorResponse'
        '502':
          description: Error de integración con servicios upstream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS4ErrorResponse'
  /analytics/ventas-por-categoria:
    get:
      summary: Ventas por categoría
      operationId: ms5ObtenerVentasPorCategoria
      tags:
        - MS5 Analytics
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS5QueryResult'
  /analytics/top-productos:
    get:
      summary: Top productos
      operationId: ms5ObtenerTopProductos
      tags:
        - MS5 Analytics
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS5QueryResult'
  /analytics/usuarios-activos:
    get:
      summary: Usuarios activos
      operationId: ms5ObtenerUsuariosActivos
      tags:
        - MS5 Analytics
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS5QueryResult'
  /analytics/ingresos-por-mes:
    get:
      summary: Ingresos por mes
      operationId: ms5ObtenerIngresosPorMes
      tags:
        - MS5 Analytics
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MS5QueryResult'
